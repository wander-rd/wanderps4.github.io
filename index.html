<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WANDER RD | PS4 GoldHEN Host</title>
<link rel="stylesheet" href="../style.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #102d50 0%, #050912 58%, #000 100%);
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    padding: 30px 12px 10px;
}

.logo {
    margin: 0;
    font-size: clamp(38px, 8vw, 76px);
    font-weight: 900;
    letter-spacing: 5px;
    color: #fff;
    text-shadow: 0 0 12px #00aaff, 0 0 30px #0077ff;
}

.subtitle {
    margin-top: 12px;
    color: #91dfff;
    font-size: 15px;
    letter-spacing: 5px;
}

.line {
    width: 150px;
    height: 3px;
    margin: 22px auto;
    background: #00baff;
    box-shadow: 0 0 18px #00baff;
}

main {
    width: 100%;
    max-width: 950px;
    margin: auto;
    padding: 10px 16px 25px;
}

.console {
    font-size: clamp(75px, 15vw, 125px);
    filter: drop-shadow(0 0 20px #008cff);
    margin: 5px 0;
}

h2 {
    color: #b5eaff;
    letter-spacing: 5px;
    font-size: clamp(18px, 4vw, 27px);
}

#msgs {
    min-height: 65px;
    margin: 25px 0;
    color: #8be3ff;
    font-size: clamp(16px, 3vw, 22px);
    text-shadow: 0 0 10px #007bff;
}

#jbButton {
    display: block;
    width: min(90%, 420px);
    margin: 25px auto;
    padding: 18px 12px;
    border: 2px solid #60dcff;
    border-radius: 7px;
    background: linear-gradient(100deg, #005bff, #00baff);
    color: #fff;
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 5px;
    box-shadow: 0 0 25px #007bff;
    cursor: pointer;
}

#jbButton:active {
    transform: scale(.97);
}

footer {
    padding: 20px 12px 30px;
    color: #8295aa;
    font-size: 12px;
    line-height: 1.9;
}

footer a {
    color: #62cfff;
    text-decoration: none;
}
</style>
</head>

<body>
<header>
    <h1 class="logo">WANDER RD</h1>
    <div class="subtitle">PLAYSTATION 4 · HOST</div>
    <div class="line"></div>
</header>

<main>
    <div class="console">🎮</div>
    <h2>GOLDHEN HOST</h2>

    <h3 id="msgs">Preparando tu experiencia gaming…</h3>

    <button id="jbButton" type="button"
        onclick="window.location.href='./index.html'">
        JAILBREAK
    </button>
</main>

<footer>
    WANDER RD · PS4 HOST<br>
    Host original: <a href="https://github.com/GamerHack/GamerHack.github.io">GamerHack</a><br>
    Créditos y agradecimiento a GamerHack y a los desarrolladores originales.
</footer>

<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.textContent =
        "No se encontró el contenido. Comprueba los archivos del host.";
}

if (!isPS4) {
    msgs.textContent =
        "Este host está diseñado para PS4 con firmware compatible.";
} else {
    msgs.textContent = "Firmware detectado: " + fwVersion;

    if (window.applicationCache.status == "0") {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            msgs.textContent = "Firmware no compatible: " + fwVersion;
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement("script");
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement("script");
            script.type = "module";
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement("script");
            script.type = "module";
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement("script");
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        } else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement("script");
            script.type = "module";
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement("script");
            script.type = "module";
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement("script");
            script.type = "module";
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else {
            msgs.textContent = "Firmware no compatible: " + fwVersion;
        }
    }
}
</script>
</body>
</html>
