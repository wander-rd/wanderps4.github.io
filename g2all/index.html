
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WANDER RD | PS4 GoldHEN Host</title>
<link rel="stylesheet" href="../style.css">

<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--cyan:#58f4ff}
body{margin:0;min-height:100vh;color:#f4f8ff;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 78% 40%,#12366a 0,transparent 43%),linear-gradient(120deg,#050916,#0a1428 60%,#030611);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;max-width:1400px;margin:0 auto;padding:26px clamp(20px,5vw,70px)}
.logo{margin:0;font-size:clamp(26px,3.8vw,42px);font-weight:900;letter-spacing:.15em;text-shadow:0 0 24px #168dff}
.subtitle{color:#9befff;font-size:11px;letter-spacing:.2em;border:1px solid #28617d;border-radius:99px;padding:10px 14px;background:#071827aa}
.line{display:none}
main{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:20px clamp(20px,5vw,70px) 42px;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.9fr);align-items:center;gap:40px}
main:before{content:"PS4 HOST";display:block;grid-column:1;grid-row:1;color:var(--cyan);font-size:12px;font-weight:bold;letter-spacing:.28em;margin-bottom:-35px}
.console{grid-column:2;grid-row:1 / span 3;display:flex;align-items:center;justify-content:center;font-size:clamp(130px,22vw,250px);filter:drop-shadow(0 0 30px #087bff);min-height:260px;position:relative}
.console:before{content:"";position:absolute;width:90%;max-width:400px;aspect-ratio:1;border:1px solid #3d8cff55;border-radius:50%;box-shadow:0 0 60px #1378ff18,inset 0 0 45px #1378ff14}
h2{grid-column:1;grid-row:2;color:#fff;letter-spacing:-.04em;font-size:clamp(40px,6vw,76px);line-height:1;margin:12px 0 8px}
#msgs{grid-column:1;grid-row:3;min-height:54px;margin:12px 0 18px;color:#91eaff;font-size:clamp(15px,1.7vw,20px);line-height:1.6;text-shadow:0 0 10px #007bff}
#jbButton{grid-column:1;grid-row:4;display:block;width:min(100%,410px);margin:10px 0;padding:19px 14px;border:1px solid #8cfaff;border-radius:8px;background:linear-gradient(110deg,#075dff,#087de5 55%,#5b42e8);color:#fff;font-size:17px;font-weight:900;letter-spacing:.2em;box-shadow:0 0 0 4px #3d9aff12,0 0 30px #087bff65;cursor:pointer}
#jbButton:hover,#jbButton:focus-visible{outline:2px solid var(--cyan);outline-offset:4px;box-shadow:0 0 40px #087bff9c}
#jbButton:active{transform:scale(.99)}
footer{width:100%;padding:18px clamp(20px,5vw,70px) 24px;border-top:1px solid #ffffff17;color:#7185a4;font-size:11px;line-height:1.9;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:#62cfff;text-decoration:none}
@media(max-width:700px){header{align-items:flex-start;flex-direction:column}main{grid-template-columns:1fr;gap:8px;padding-top:18px}.console{grid-column:1;grid-row:1;min-height:180px;font-size:clamp(100px,32vw,180px)}main:before{grid-column:1;grid-row:2;margin:0}h2{grid-column:1;grid-row:3;font-size:clamp(38px,10vw,58px)}#msgs{grid-column:1;grid-row:4}#jbButton{grid-column:1;grid-row:5;margin:8px auto}footer{justify-content:center;text-align:center}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>

<body>
<header>
    <h1 class="logo">WANDER RD</h1>
    <div class="subtitle">PLAYSTATION 4 · HOST</div>
    <div class="line"></div>
</header>

<main>
    <div class="console">🎮</div>
    <h2>GOLDHEN HOST</h2>

    <h3 id="msgs">Preparando tu experiencia gaming…</h3>

    <button id="jbButton" type="button" onclick="showHostInfo()">ESTADO DEL HOST</button>
</main>

<footer>
    WANDER RD · PS4 HOST<br>
    Host original: <a href="https://github.com/GamerHack/GamerHack.github.io">GamerHack</a><br>
    Créditos y agradecimiento a GamerHack y a los desarrolladores originales.
</footer>

<script>
function showHostInfo() {
    var m = document.getElementById("msgs");
    if (m) {
        m.textContent = "El host se inicia automáticamente al abrir esta página. Si la consola se queda bloqueada, no pulses repetidamente; reinicia la consola antes de volver a intentarlo.";
    }
}
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.textContent =
        "No se encontró el contenido. Comprueba los archivos del host.";
}

if (!isPS4) {
    msgs.textContent =
        "Este host está diseñado para PS4 con firmware compatible.";
} else {
    msgs.textContent = "Firmware detectado: " + fwVersion;

    if (window.applicationCache.status == "0") {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 13.52) {
            window.location.replace("cacheslopkit.html");
        } else {
            msgs.textContent = "Firmware no compatible: " + fwVersion;
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement("script");
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement("script");
            script.type = "module";
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement("script");
            script.type = "module";
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement("script");
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        } else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement("script");
            script.type = "module";
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement("script");
            script.type = "module";
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement("script");
            script.type = "module";
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        } else {
            msgs.textContent = "Firmware no compatible: " + fwVersion;
        }
    }
}
</script>
</body>
</html>
